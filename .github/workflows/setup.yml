# ─────────────────────────────────────────────────────────────────────────────
# SETUP — configuração inicial do site no servidor (manual, workflow_dispatch).
#
# Envia `content/` para um diretório temporário e roda `content/setup.php` com
# o WP-CLI: ativa o tema, cria as páginas e os posts e define os links
# permanentes. Pode rodar mais de uma vez; o que já existe não é recriado.
#
# Também fixa no wp-config.php o prefixo das tags do LiteSpeed Cache. Sem ele,
# o prefixo vem do caminho real do plugin, que muda a cada release, e a limpeza
# do cache não alcança páginas guardadas em releases anteriores. Por isso o
# setup termina esvaziando o cache inteiro.
# Rode depois do primeiro deploy. Usa os mesmos secrets do `deploy.yml`.
# ─────────────────────────────────────────────────────────────────────────────
name: Setup (Hostinger)

on:
  workflow_dispatch:
  # A branch do site não é a padrão do repositório, e o GitHub só registra um
  # workflow manual fora da branch padrão depois de uma execução. Um push que
  # altere este arquivo cria essa execução; o job é pulado.
  push:
    branches:
      - carvalho-cc
    paths:
      - .github/workflows/setup.yml

# Mesmo group do deploy → setup e deploy nunca rodam ao mesmo tempo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup (wp eval-file)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Send content and run setup.php
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          WP_ROOT_SUBPATH: domains/carvalho.cc/public_html
        run: |
          set -euo pipefail
          SSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          SETUP_DIR="$($SSH "$REMOTE" 'mktemp -d')"
          [ -n "$SETUP_DIR" ] || { echo "::error::Não foi possível criar o diretório temporário no host remoto."; exit 1; }
          rsync -az -e "$SSH" content/ "$REMOTE:$SETUP_DIR/"

          WP_REMOTE="DEPLOY_WP_ROOT=\"\$HOME/$WP_ROOT_SUBPATH\" bash -s --"
          $SSH "$REMOTE" "$WP_REMOTE config set LSWCP_TAG_PREFIX crv --type=constant" < .github/scripts/remote-wp.sh

          status=0
          $SSH "$REMOTE" "$WP_REMOTE eval-file '$SETUP_DIR/setup.php'" < .github/scripts/remote-wp.sh || status=$?
          $SSH "$REMOTE" "rm -rf '$SETUP_DIR'"
          [ "$status" -eq 0 ] || exit "$status"
          echo "✅ Setup aplicado."

          $SSH "$REMOTE" "$WP_REMOTE eval 'LiteSpeed\\Core::cls()->proceed_action(\"empty_all\"); LiteSpeed\\Core::kick_purge_queue() || exit(1);'" < .github/scripts/remote-wp.sh \
            && echo "✅ Cache do LiteSpeed esvaziado." \
            || echo "::warning::Não foi possível esvaziar o cache do LiteSpeed."
